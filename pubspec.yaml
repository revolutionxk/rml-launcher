name: rml_launcher
description: Desktop launcher for Roblox Studio with Roblox ModLoader.
publish_to: 'none'
version: 2.0.0-dev+1

environment:
  sdk: ^3.13.0

workspace:
  - packages/rml_native

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  go_router: ^18.0.2

  slang: ^4.19.2
  slang_flutter: ^4.19.0

  window_manager: ^0.5.2
  path: ^1.9.1

  rml_native:
    path: packages/rml_native

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  archive: ^4.5.1

flutter:
  assets:
    - assets/brand/

  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.ttf
        - asset: assets/fonts/SourceCodePro-Medium.ttf
          weight: 500
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
