name: Flutter

on:
  pull_request:
  push:
    branches: [develop, main, feat/flutter-rewrite]

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart run slang
      - name: Generated files are committed
        if: runner.os == 'Linux'
        run: git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      - run: dart test
        working-directory: packages/rml_native

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S packages/rml_native -B build/native -DRML_NATIVE_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
