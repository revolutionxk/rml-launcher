[workspace]
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.100"
goblin = "0.9.3"
regex = "1.12.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[package]
name = "rml-launcher"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rml_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = "1"
anyhow = { workspace = true }
chrono = { version = "0.4.42", features = ["clock", "serde"] }
futures-util = "0.3.31"
md-5 = "0.10.6"
plist = "1.7"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
rml-flag-scanner = { path = "crates/rml-flag-scanner" }
sha2 = "0.10.9"
thiserror = { workspace = true }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.22.22"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zip = "2.4.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

